<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGA Studio - Thank You</title>
    <link rel="icon" href="pgap.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #e6cec1;
            --container-bg: #3c5458;
            --form-bg: #74969f;
            --text-primary: #85c4d6;
            --text-secondary: #ffffff;
            --input-text: #111111;
            --highlight: #a288c9;
            --nav-bg: #3c5458;
            --footer-bg: #2b3e41;
            --shadow: 0 8px 15px rgba(0,0,0,0.3);
        }

        .dark-mode {
            --bg-color: #1a1a2e;
            --container-bg: #16213e;
            --form-bg: #2a4158;
            --text-primary: #e94560;
            --text-secondary: #f0f0f0;
            --input-text: #111111;
            --highlight: #0f3460;
            --nav-bg: #0f3460;
            --footer-bg: #121212;
            --shadow: 0 8px 15px rgba(0,0,0,0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Dela Gothic One', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-secondary);
            transition: background-color 0.4s ease, color 0.4s ease;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            transform: translateZ(0);
        }

        body::before {
            background-image:
                radial-gradient(circle at 15% 18%, rgba(255,255,255,0.14), transparent 14%),
                radial-gradient(circle at 80% 12%, rgba(255,255,255,0.12), transparent 12%),
                radial-gradient(circle at 45% 72%, rgba(255,255,255,0.08), transparent 18%);
            filter: blur(12px);
            opacity: 0.45;
            animation: drift-circles 24s ease-in-out infinite alternate;
        }

        body::after {
            background-image:
                radial-gradient(circle at 32% 82%, rgba(255,255,255,0.10), transparent 13%),
                radial-gradient(circle at 70% 42%, rgba(255,255,255,0.08), transparent 12%);
            filter: blur(16px);
            opacity: 0.28;
            animation: drift-circles 28s ease-in-out infinite alternate-reverse;
        }

        body > * {
            position: relative;
            z-index: 1;
        }

        @keyframes drift-circles {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-18px) scale(1.02); }
        }

        header { padding: 20px 40px; }

        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-logo {
            width: 60px;
            height: 60px;
            background-color: #3b2a22;
            border-radius: 50%;
            padding: 5px;
            cursor: pointer;
            box-shadow: var(--shadow);
            object-fit: cover;
        }

        .btn-toggle {
            background-color: var(--container-bg);
            color: var(--text-primary);
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }

        .btn-toggle:hover { transform: scale(1.05); }

        nav {
            background-color: var(--nav-bg);
            border-radius: 30px;
            padding: 10px 20px;
            box-shadow: var(--shadow);
            max-width: 800px;
            margin: 0 auto;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: space-around;
            position: relative;
        }

        nav a {
            text-decoration: none;
            color: var(--text-primary);
            font-size: 1.2rem;
            padding: 10px 20px;
            display: block;
            position: relative;
            z-index: 1;
        }

        .nav-indicator {
            position: absolute;
            bottom: 0;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.1);
            border-bottom: 4px solid var(--text-primary);
            border-radius: 15px;
            z-index: 0;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .thx-main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .thx-card {
            background-color: var(--form-bg);
            padding: 50px 40px;
            border-radius: 40px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            text-align: center;
        }

        .thx-card h1 {
            font-size: 2.6rem;
            color: var(--text-primary);
        }

        .thx-card p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .result-name {
            font-size: 1.5rem;
            color: var(--text-secondary);
            font-weight: bold;
        }

        .home-btn {
            background-color: var(--container-bg);
            color: var(--text-primary);
            border: none;
            padding: 16px 36px;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }

        .home-btn:hover { transform: scale(1.05); }

        footer {
            text-align: center;
            padding: 20px;
            background-color: var(--footer-bg);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            header { padding: 20px; }
            nav ul { flex-direction: column; align-items: center; }
            .nav-indicator { display: none; }
            .thx-main { padding: 20px; }
            .thx-card { padding: 30px 20px; }
        }
    </style>
</head>
<body class="light-mode">
    <header>
        <div class="top-controls">
            <div class="logo-area">
                <img src="pgap.png" alt="PGA Logo" class="header-logo">
            </div>
            <div class="toggle-buttons">
                <button id="lang-toggle" class="btn-toggle">AR/EN</button>
                <button id="theme-toggle" class="btn-toggle">🌓</button>
            </div>
        </div>

        <nav>
            <ul id="nav-list">
                <li><a href="index.html" data-en="Home" data-ar="الرئيسية">Home</a></li>
                <li><a href="about.html" data-en="About" data-ar="حول">About</a></li>
                <li><a href="projects.html" data-en="Projects" data-ar="المشاريع">Projects</a></li>
                <li><a href="contact.html" data-en="Contact" data-ar="تواصل معنا">Contact</a></li>
                <li><a href="thx.html" class="active" data-en="Thank You" data-ar="شكراً">Thank You</a></li>
                <div class="nav-indicator"></div>
            </ul>
        </nav>
    </header>

    <main class="thx-main">
        <section class="thx-card">
            <h1 data-en="Thank you!" data-ar="شكراً لك!">Thank you!</h1>
            <div class="result-name" id="senderName">Dear visitor</div>
            <p data-en="Thank you for your message. We will contact you soon." data-ar="شكراً لرسالتك. سنتواصل معك في وقت قريب.">Thank you for your message. We will contact you soon.</p>
            <a href="index.html" class="home-btn" data-en="Back to Home" data-ar="العودة إلى الرئيسية">Back to Home</a>
        </section>
    </main>

    <footer>
        <p data-en="© 2026 PGA Studio - All Rights Reserved | " data-ar="© 2026 PGA Studio - جميع الحقوق محفوظة | ">© 2026 PGA Studio - All Rights Reserved | </p>
        <p style="display: inline;"><a href="privacy.html" style="color: inherit; text-decoration: underline;" data-en="Privacy Policy" data-ar="سياسة الخصوصية">Privacy Policy</a></p>
    </footer>

    <script>
        const updateIndicator = () => {
            const activeLink = document.querySelector('nav a.active');
            const indicator = document.querySelector('.nav-indicator');
            if (activeLink && indicator) {
                indicator.style.width = `${activeLink.offsetWidth}px`;
                indicator.style.left = `${activeLink.offsetLeft}px`;
            }
        };

        window.addEventListener('load', updateIndicator);
        window.addEventListener('resize', updateIndicator);

        const themeBtn = document.getElementById('theme-toggle');
        const langBtn = document.getElementById('lang-toggle');
        const body = document.body;
        const senderName = document.getElementById('senderName');
        const storedLang = localStorage.getItem('selectedLang');
        let currentLang = storedLang || document.documentElement.lang || 'en';

        const arabicLinkId = 'arabic-fonts';
        const ensureArabicFont = (enable) => {
            if (enable) {
                if (!document.getElementById(arabicLinkId)) {
                    const link = document.createElement('link');
                    link.id = arabicLinkId;
                    link.rel = 'stylesheet';
                    link.href = 'fonts.css';
                    document.head.appendChild(link);
                }
            } else {
                const existing = document.getElementById(arabicLinkId);
                if (existing) existing.remove();
            }
        };

        const updateSenderName = () => {
            const params = new URLSearchParams(window.location.search);
            const name = params.get('name');
            if (name) {
                senderName.textContent = name;
            } else {
                senderName.textContent = currentLang === 'ar' ? 'عزيزي الزائر' : 'Dear visitor';
            }
        };

        const setLanguage = (lang) => {
            currentLang = lang;
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.querySelectorAll('[data-en][data-ar]').forEach(el => {
                el.innerHTML = el.getAttribute(`data-${lang}`);
            });
            ensureArabicFont(lang === 'ar');
            localStorage.setItem('selectedLang', lang);
            updateSenderName();
            updateIndicator();
        };

        setLanguage(currentLang);

        if (localStorage.getItem('theme') === 'dark') {
            body.classList.replace('light-mode', 'dark-mode');
        }

        themeBtn.addEventListener('click', () => {
            if (body.classList.contains('light-mode')) {
                body.classList.replace('light-mode', 'dark-mode');
                localStorage.setItem('theme', 'dark');
            } else {
                body.classList.replace('dark-mode', 'light-mode');
                localStorage.setItem('theme', 'light');
            }
        });

        langBtn.addEventListener('click', () => {
            setLanguage(currentLang === 'en' ? 'ar' : 'en');
        });
    </script>
</body>
</html>
